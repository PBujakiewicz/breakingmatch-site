# Instalacja (raz na klon): pip install pre-commit && pre-commit install
# Ręcznie na całym repo: pre-commit run --all-files
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: end-of-file-fixer
        exclude: '\.(meta|unity|prefab|asset|mat|anim|controller)$'
      - id: trailing-whitespace
        exclude: '\.(meta|unity|prefab|asset|mat|anim|controller|md)$'
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-json
        exclude: '^.*\.(asmdef|asmref)$'
      - id: check-yaml
        exclude: '^(Assets|ProjectSettings|Packages)/'
      - id: detect-private-key
